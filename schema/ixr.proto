// ixr schema — Protocol Buffer definitions for the ixr event bus and API types.
// Version: v1
//
// Go is the source of truth (pkg/schema/). This file is a derived artifact
// kept in sync with the Go types — see internal/ingress/schema_test.go, which
// fails CI if this drifts from the live GET /v1/schema JSON Schema. Do NOT
// add runtime proto dependencies to the ixr binary — this file is for
// consumer language SDK generation only.
//
// Usage (Python):
//   pip install grpcio-tools
//   python -m grpc_tools.protoc -I. --python_out=. schema/ixr.proto
//
// Usage (TypeScript):
//   npm install -g ts-proto
//   protoc --plugin=./node_modules/.bin/protoc-gen-ts_proto --ts_proto_out=. schema/ixr.proto
//
// Usage (Rust):
//   use prost-build in build.rs

syntax = "proto3";
package ixr.v1;
option go_package = "github.com/YashVishwas/ixr/pkg/schema;schema";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Core request / response types
// ─────────────────────────────────────────────────────────────────────────────

// ContentPart is one block of a multi-part message (text + images).
message ContentPart {
  string type = 1; // "text" | "image_url"
  string text = 2;
  ImageURLPart image_url = 3;
}

// ImageURLPart is an image reference: an https:// URL, or a data: URI
// carrying inline base64 image bytes.
message ImageURLPart {
  string url    = 1;
  string detail = 2; // "auto" | "low" | "high"
}

// Message is a single turn in a conversation. content is either a plain
// string or, for multimodal turns, an array of ContentPart — encoded here as
// google.protobuf.Value since proto3 has no native union type; see
// pkg/schema/content.go's MarshalJSON/UnmarshalJSON for the wire shape this
// mirrors.
message Message {
  string role                 = 1; // "system" | "user" | "assistant" | "tool"
  google.protobuf.Value content = 2; // string | ContentPart[]
  repeated ToolCall tool_calls = 3;
  string tool_call_id         = 4; // set on role="tool" messages; identifies which ToolCall this responds to
  string name                 = 5; // optional function name on role="tool" messages
}

// Tool describes a callable function the model may invoke.
message Tool {
  string      type     = 1; // always "function"
  FunctionDef function = 2;
}

// FunctionDef is the schema for a callable function.
message FunctionDef {
  string name        = 1;
  string description = 2;
  // parameters is a JSON Schema object serialized as a Struct.
  google.protobuf.Struct parameters = 3;
  bool   strict      = 4;
}

// ToolCall is a single tool invocation requested by the model.
message ToolCall {
  string       id       = 1;
  string       type     = 2; // "function"
  ToolFunction function = 3;
}

// ToolFunction holds the name and JSON-encoded arguments for a tool call.
message ToolFunction {
  string name      = 1;
  string arguments = 2; // JSON-encoded string
}

// RequestEnvelope is ixr's canonical inbound chat request.
// Mirrors the OpenAI /v1/chat/completions request body.
message RequestEnvelope {
  string            model       = 1;
  repeated Message  messages    = 2;
  bool              stream      = 3;
  repeated Tool     tools       = 4;
  // tool_choice: "none" | "auto" | "required" | {"type":"function","function":{"name":"..."}}
  google.protobuf.Value tool_choice = 5;
  double            temperature = 6;
  int32             max_tokens  = 7;
  double            top_p       = 8;
  int32             n           = 9;
  // stop: string | []string
  google.protobuf.Value stop    = 10;
  string            user        = 11;
}

// Choice is one completion candidate in a response.
message Choice {
  int32   index         = 1;
  Message message       = 2;
  string  finish_reason = 3;
}

// Usage reports token consumption for a call.
message Usage {
  int32 prompt_tokens     = 1;
  int32 completion_tokens = 2;
  int32 total_tokens      = 3;
  // cache_read_input_tokens and cache_creation_input_tokens report
  // Anthropic-style prompt-caching activity (0 for providers that don't
  // support it). prompt_tokens already includes these — they're a
  // breakdown, not additional tokens.
  int32 cache_read_input_tokens     = 4;
  int32 cache_creation_input_tokens = 5;
}

// ResponseEnvelope is ixr's canonical chat response.
// Shaped to match the OpenAI response format.
message ResponseEnvelope {
  string           id      = 1;
  string           object  = 2;
  int64            created = 3; // Unix timestamp
  string           model   = 4;
  repeated Choice  choices = 5;
  Usage            usage   = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Embeddings
// ─────────────────────────────────────────────────────────────────────────────

// EmbeddingRequest is the canonical form of a POST /v1/embeddings body.
message EmbeddingRequest {
  string input_string          = 1; // input: string variant
  repeated string input_array  = 2; // input: []string variant
  string model                 = 3;
  string encoding_format       = 4; // "float" | "base64"
  int32  dimensions            = 5;
  string user                  = 6;
}

// EmbeddingObject is one embedding in the response.
message EmbeddingObject {
  string object          = 1; // "embedding"
  int32  index           = 2;
  repeated float embedding = 3;
}

// EmbeddingUsage reports token consumption for an embedding call.
message EmbeddingUsage {
  int32 prompt_tokens = 1;
  int32 total_tokens  = 2;
}

// EmbeddingResponse is the canonical form of a /v1/embeddings response.
message EmbeddingResponse {
  string object                   = 1; // "list"
  repeated EmbeddingObject data    = 2;
  string model                    = 3;
  EmbeddingUsage usage             = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Images
// ─────────────────────────────────────────────────────────────────────────────

// ImageRequest is the canonical form of a POST /v1/images/generations body.
message ImageRequest {
  string model           = 1;
  string prompt          = 2;
  int32  n               = 3; // number of images (default 1)
  string size            = 4; // "1024x1024"
  string quality         = 5; // "standard" | "hd"
  string style           = 6; // "vivid" | "natural"
  string response_format = 7; // "url" | "b64_json"
  string user            = 8;
}

// ImageData holds one generated image.
message ImageData {
  string url            = 1;
  string b64_json       = 2;
  string revised_prompt = 3;
}

// ImageResponse is the canonical form of a /v1/images/generations response.
message ImageResponse {
  int64 created            = 1;
  repeated ImageData data  = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Audio
// ─────────────────────────────────────────────────────────────────────────────

// AudioSpeechRequest is the canonical form of a POST /v1/audio/speech body.
message AudioSpeechRequest {
  string model           = 1;
  string input           = 2;
  string voice           = 3; // alloy | echo | fable | onyx | nova | shimmer
  string response_format = 4; // mp3 | opus | aac | flac | wav | pcm
  double speed           = 5; // 0.25–4.0
}

// TranscriptionRequest is the canonical form of a POST /v1/audio/transcriptions
// body. The audio file itself is sent as multipart form-data (field "file"),
// so it has no representation here.
message TranscriptionRequest {
  string model           = 1;
  string language        = 2;
  string prompt          = 3;
  double temperature     = 4;
  string response_format = 5; // json | text | srt | verbose_json | vtt
}

// TranscriptionResponse is the canonical form of a /v1/audio/transcriptions response.
message TranscriptionResponse {
  string text = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Cost
// ─────────────────────────────────────────────────────────────────────────────

// CostBreakdown holds the USD cost components for a single LLM call.
message CostBreakdown {
  double input_usd  = 1;
  double output_usd = 2;
  double total_usd  = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Identity
// ─────────────────────────────────────────────────────────────────────────────

// Identity carries the caller's tenant, team, user, and use-case context.
// The hierarchy for budget enforcement is: tenant (org) → team → user.
message Identity {
  string tenant_id  = 1;
  string team_id    = 2;
  string user_id    = 3;
  string use_case_id = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Event bus — CallEvent
// ─────────────────────────────────────────────────────────────────────────────

// ShadowMetadata is attached to CallEvents emitted for shadow-routed requests.
message ShadowMetadata {
  string primary_id    = 1;
  string primary_model = 2;
  string shadow_model  = 3;
}

// CallEvent is emitted on the ixr event bus for every LLM call.
// It is the primary unit of data that plugins and downstream systems consume.
// Plugins receive this via the EventConsumer.OnEvent callback.
//
// JSON equivalent is emitted by the audit-log plugin (one line per call).
message CallEvent {
  string                    id           = 1;
  google.protobuf.Timestamp timestamp    = 2;
  string                    use_case_id  = 3;
  string                    tenant_id    = 4;
  string                    team_id      = 5;
  string                    user_id      = 6;
  string                    provider     = 7;
  string                    model        = 8;
  // latency_ms is the provider round-trip time in milliseconds.
  int64                     latency_ms   = 9;
  int32                     tokens_in    = 10;
  int32                     tokens_out   = 11;
  CostBreakdown             cost         = 12;
  RequestEnvelope           request      = 13;
  ResponseEnvelope          response     = 14;
  // error is non-empty when the provider call failed.
  string                    error        = 15;
  bool                      streaming    = 16;
  ShadowMetadata            shadow       = 17;
  // auto_routed marks a call that arrived via model:"auto" — only these
  // train the bandit reward plugin (RFC Gap 12); a caller who named a model
  // explicitly didn't opt into exploration.
  bool                      auto_routed  = 18;
  // fallback_used reports whether the call was served by a fallback model
  // after the originally-requested model (fallback_from) failed — e.g. via
  // context-window escalation. Both are zero-value on the common path.
  bool                      fallback_used = 19;
  string                    fallback_from = 20;
}

// ─────────────────────────────────────────────────────────────────────────────
// Telemetry
// ─────────────────────────────────────────────────────────────────────────────

// TelemetryRecord is written by the telemetry plugin for every call.
// It carries routing metadata beyond what CallEvent holds and is what
// scoring engines and observability systems should consume.
message TelemetryRecord {
  string                    request_id    = 1;
  string                    use_case_id   = 2;
  string                    tenant_id     = 3;
  string                    intent        = 4;
  string                    model         = 5;
  string                    response_model = 6; // actual model returned (may differ)
  string                    provider      = 7;
  int32                     latency_ms    = 8;
  int32                     tokens_in     = 9;
  int32                     tokens_out    = 10;
  int32                     max_tokens    = 11;
  double                    cost_usd      = 12;
  bool                      success       = 13;
  string                    error_message = 14;
  string                    finish_reason = 15;
  bool                      fallback_used = 16;
  string                    fallback_from = 17;
  bool                      shadow        = 18;
  string                    shadow_of     = 19;
  google.protobuf.Timestamp timestamp     = 20;
}
