syntax = "proto3";

package ixr.v1;

option go_package = "github.com/YashVishwas/ixr/api/proto/ixrv1";

import "google/protobuf/timestamp.proto";

// ─── Chat Completions ──────────────────────────────────────────────────────────

message RequestEnvelope {
  string model = 1;
  repeated Message messages = 2;
  bool stream = 3;
  repeated Tool tools = 4;
  oneof tool_choice {
    string tool_choice_string = 5;   // "none" | "auto" | "required"
    ToolChoiceObject tool_choice_object = 6;
  }
  float temperature = 7;
  int32 max_tokens = 8;
  float top_p = 9;
  int32 n = 10;
  string user = 11;
}

message Message {
  string role = 1;       // system | user | assistant | tool
  string content = 2;
  repeated ToolCall tool_calls = 3;
  string tool_call_id = 4; // for role=tool messages
}

message Tool {
  string type = 1;       // always "function"
  FunctionDef function = 2;
}

message FunctionDef {
  string name = 1;
  string description = 2;
  string parameters_json = 3; // JSON Schema serialized as string
  bool strict = 4;
}

message ToolChoiceObject {
  string type = 1;    // "function"
  string function_name = 2;
}

message ToolCall {
  string id = 1;
  string type = 2;    // "function"
  ToolFunction function = 3;
}

message ToolFunction {
  string name = 1;
  string arguments = 2; // JSON-encoded arguments
}

message ResponseEnvelope {
  string id = 1;
  string object = 2;
  int64 created = 3;
  string model = 4;
  repeated Choice choices = 5;
  Usage usage = 6;
}

message Choice {
  int32 index = 1;
  Message message = 2;
  string finish_reason = 3;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

// ─── Embeddings ───────────────────────────────────────────────────────────────

message EmbeddingRequest {
  string model = 1;
  repeated string input = 2;
  string encoding_format = 3;
  int32 dimensions = 4;
}

message EmbeddingObject {
  string object = 1;
  int32 index = 2;
  repeated float embedding = 3;
}

message EmbeddingResponse {
  string object = 1;
  repeated EmbeddingObject data = 2;
  string model = 3;
}

// ─── Events / Telemetry ───────────────────────────────────────────────────────

message CallEvent {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string use_case_id = 3;
  string tenant_id = 4;
  string provider = 5;
  string model = 6;
  int64 latency_ms = 7;
  int32 tokens_in = 8;
  int32 tokens_out = 9;
  RequestEnvelope request = 10;
  ResponseEnvelope response = 11;
  string error = 12;
  bool streaming = 13;
}

message TelemetryRecord {
  string request_id = 1;
  string use_case_id = 2;
  string tenant_id = 3;
  string intent = 4;
  string model = 5;
  string provider = 6;
  int32 latency_ms = 7;
  int32 tokens_in = 8;
  int32 tokens_out = 9;
  double cost_usd = 10;
  bool success = 11;
  string finish_reason = 12;
  bool fallback_used = 13;
  string fallback_from = 14;
  google.protobuf.Timestamp timestamp = 15;
}

// ─── Schema Service ───────────────────────────────────────────────────────────

service IxrSchemaService {
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
}

message GetSchemaRequest {}

message GetSchemaResponse {
  string proto_descriptor = 1; // base64-encoded FileDescriptorProto
  string json_schema = 2;      // JSON Schema for REST clients
  string version = 3;
}
