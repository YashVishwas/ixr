server:
  port: 8090

log_level: info

providers:
  openai:
    api_key: ${OPENAI_API_KEY}
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
  # Google AI Studio (same key for Gemini + Gemma free-tier models).
  gemini:
    api_key: ${GOOGLE_API_KEY}
  gemma:
    api_key: ${GOOGLE_API_KEY}
  # Groq free tier — Llama family (e.g. llama-3.1-8b-instant).
  llama:
    api_key: ${GROQ_API_KEY}
  # DeepSeek (e.g. deepseek-chat).
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
  # Free-tier providers aligned with https://github.com/tashfeenahmed/freellmapi
  cerebras:
    api_key: ${CEREBRAS_API_KEY}
  mistral:
    api_key: ${MISTRAL_API_KEY}
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
  sambanova:
    api_key: ${SAMBANOVA_API_KEY}
  github:
    api_key: ${GITHUB_TOKEN}
  zhipu:
    api_key: ${ZHIPU_API_KEY}

# ── Multi-model chains ────────────────────────────────────────────────────────
# Invoke via header:  X-IXR-Chain: <chain-name>
# Inline (no config): X-IXR-Chain: qwen3-8b,claude-sonnet-4-6
#
# Each stage receives the full conversation history including every prior
# stage's response, so later models can address gaps or uncertainties.
chains:
  # smart-qa: free fast model answers first; Claude reviews and refines.
  smart-qa:
    models:
      - auto                     # ixr picks the specialist based on X-IXR-Task
      - claude-sonnet-4-6        # reviewer / synthesizer
    prompts:
      - ""
      - "Review the previous answer. Address any gaps, uncertainties, or errors. Provide a final, improved response."

  # fast-refine: two free models; Cerebras drafts, Groq/Llama refines.
  fast-refine:
    models:
      - gpt-oss-120b
      - zai-glm-4.7
    prompts:
      - ""
      - "Improve the previous answer: fix any inaccuracies and make it more concise."

  # debate: three models tackle the same question and the last synthesizes.
  debate:
    models:
      - gpt-oss-120b
      - mistral-small-latest
      - claude-sonnet-4-6
    prompts:
      - ""
      - "Consider the previous answer critically. Offer a different perspective or correct any mistakes."
      - "Synthesize the two perspectives above into the best possible answer."
